name: Keep Alive

on:
  schedule:
    # Run every day at 06:00, 14:00, and 22:00 UTC to keep Supabase alive
    # Supabase free-tier pauses after 7 days of inactivity
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Check (DB query via Vercel)
        run: |
          echo "Pinging health check endpoint..."
          HTTP_STATUS=$(curl -s -o /tmp/health_response.json -w "%{http_code}" https://ob-bank.vercel.app/api/health)
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/health_response.json
          echo ""
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::warning::Health check failed with status $HTTP_STATUS"
            # Retry once after 30 seconds
            echo "Retrying in 30 seconds..."
            sleep 30
            HTTP_STATUS=$(curl -s -o /tmp/health_retry.json -w "%{http_code}" https://ob-bank.vercel.app/api/health)
            echo "Retry HTTP Status: $HTTP_STATUS"
            cat /tmp/health_retry.json
            echo ""
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "::error::Health check retry also failed. Database may be paused."
            fi
          else
            echo "✅ Database is healthy via Vercel"
          fi

      - name: Direct Supabase REST Ping (backup keep-alive)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::SUPABASE_URL or SUPABASE_ANON_KEY not set. Skipping direct ping."
            echo "To enable, add these as GitHub repository secrets."
            exit 0
          fi
          echo "Pinging Supabase REST API directly..."
          HTTP_STATUS=$(curl -s -o /tmp/supabase_response.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase HTTP Status: $HTTP_STATUS"
          cat /tmp/supabase_response.json
          echo ""
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Supabase database is responding directly"
          else
            echo "::warning::Direct Supabase ping returned status $HTTP_STATUS"
          fi
